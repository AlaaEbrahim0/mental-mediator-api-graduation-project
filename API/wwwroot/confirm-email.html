<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f7f5;
            color: #1f2933;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            width: min(420px, calc(100% - 2rem));
            padding: 2rem;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            margin: 0 0 0.75rem;
        }

        p {
            line-height: 1.5;
            color: #52606d;
        }

        .status {
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <h1>Email confirmation</h1>
        <p id="message">Confirming your email address&hellip;</p>
        <p class="status" id="status" role="status"></p>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            var id = params.get("id") || "";
            var token = params.get("token") || "";

            // The fragment is never sent to the server and is removed before
            // the request, so the token does not remain in browser history.
            window.history.replaceState(null, "", window.location.pathname);

            var message = document.getElementById("message");
            var status = document.getElementById("status");

            // The API chooses the portal from the account role and configured
            // origin. The client only accepts an absolute HTTP(S) URL without
            // credentials, so a modified payload cannot become an open redirect.
            function safeRedirect(value) {
                if (typeof value !== "string" || !value) return null;
                try {
                    var url = new URL(value);
                    var localHttp = url.protocol === "http:" &&
                        ["localhost", "127.0.0.1", "[::1]", "::1"].indexOf(url.hostname) !== -1;
                    if (url.protocol !== "https:" && !localHttp) return null;
                    if (url.username || url.password) return null;
                    return url.href;
                } catch (error) {
                    return null;
                }
            }

            if (!id || !token) {
                message.textContent = "This confirmation link is incomplete or has already been used.";
                return;
            }

            fetch("/api/auth/confirm-email", {
                method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json" },
                body: JSON.stringify({ id: id, token: token })
            })
                .then(function (response) {
                    if (!response.ok) {
                        return response.json().then(function (payload) {
                            throw new Error(payload && (payload.detail || payload.title) ||
                                "The confirmation link is invalid or has expired.");
                        });
                    }

                    return response.json().then(function (payload) {
                        var target = safeRedirect(payload && payload.redirectUrl);
                        if (target) {
                            window.location.replace(target);
                            return;
                        }

                        window.location.replace("/successfulEmailConfirmation.html");
                    });
                })
                .catch(function (error) {
                    message.textContent = "We could not confirm your email address.";
                    status.textContent = error.message;
                });
        })();
    </script>
</body>
</html>
