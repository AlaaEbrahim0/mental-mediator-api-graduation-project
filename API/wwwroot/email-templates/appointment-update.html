<p style="margin:0 0 16px;color:#374151;font-size:15px;line-height:1.65;">Hello {{recipientName}},</p>
<p style="margin:0 0 20px;color:#374151;font-size:15px;line-height:1.65;">{{intro}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;">
    <tr>
        <td style="padding:14px 18px;color:#6b7280;font-size:13px;width:120px;">Appointment</td>
        <td style="padding:14px 18px;color:#111827;font-size:14px;font-weight:600;">#{{appointmentId}}</td>
    </tr>
    <tr>
        <td style="padding:14px 18px;border-top:1px solid #e5e7eb;color:#6b7280;font-size:13px;">When</td>
        <td style="padding:14px 18px;border-top:1px solid #e5e7eb;color:#111827;font-size:14px;font-weight:600;">{{appointmentWhen}}</td>
    </tr>
</table>
<p style="margin:0 0 20px;color:#374151;font-size:15px;line-height:1.65;">{{note}}</p>
<p style="margin:0;color:#6b7280;font-size:13px;line-height:1.6;">You can review your appointments in your Nexus account.</p>
