<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;padding:32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    <tr>
                        <td style="background-color:#0f766e;padding:24px 32px;">
                            <span style="display:block;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.02em;">Nexus</span>
                            <span style="display:block;margin-top:3px;color:#ccfbf1;font-size:13px;">Mental Mediator</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 18px;color:#111827;font-size:22px;line-height:1.3;">{{title}}</h1>
                            {{content}}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;background-color:#f9fafb;border-top:1px solid #e5e7eb;">
                            <p style="margin:0;color:#6b7280;font-size:12px;line-height:1.6;">This is an automated message from Nexus. Please do not reply to this email.</p>
                            <p style="margin:5px 0 0;color:#9ca3af;font-size:12px;">&copy; {{year}} Nexus &middot; Mental Mediator</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
