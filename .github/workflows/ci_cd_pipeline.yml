name: Nexus API - MonsterASP Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: monsterasp-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  deploy:
    name: Publish and deploy to MonsterASP
    needs: build-test
    runs-on: windows-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Microsoft Web Deploy if needed
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install webdeploy -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Microsoft Web Deploy." }
          }
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $cmd = Get-Command msdeploy.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found = $cmd.Source }
          }
          if (-not $found) { throw "msdeploy.exe was not found after installation." }
          "MSDEPLOY_EXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish API for IIS
        shell: pwsh
        run: |
          dotnet publish API/API.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create production settings
        shell: pwsh
        env:
          CONSTR_SOMEE: ${{ secrets.PRODUCTION_CONSTR_SOMEE }}
          JWT_KEY: ${{ secrets.PRODUCTION_JWT_KEY }}
          GOOGLE_ID: ${{ secrets.PRODUCTION_GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.PRODUCTION_GOOGLE_SECRET }}
          MAIL_USERNAME: ${{ secrets.PRODUCTION_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.PRODUCTION_MAIL_PASSWORD }}
          NEWS_API_KEY: ${{ secrets.PRODUCTION_NEWS_API_KEY }}
        run: |
          $required = @("CONSTR_SOMEE", "JWT_KEY", "GOOGLE_ID", "GOOGLE_SECRET", "MAIL_USERNAME", "MAIL_PASSWORD", "NEWS_API_KEY")
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub Actions secret for $name is missing."
            }
          }
          $settings = @{
            ConnectionStrings = @{ constr = ""; constr_somee = $env:CONSTR_SOMEE; constr_docker = "" }
            Logging = @{ LogLevel = @{ Default = "Information"; Microsoft = "Warning"; "Microsoft.Hosting.Lifetime" = "Information" } }
            AllowedHosts = "*"
