name: Nexus API CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nexus-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Docker Hub publishing. The live host is IIS on MonsterASP.NET, so this job
  # is not on the deploy critical path; a registry failure must not leave the
  # site down. The image is kept in sync for container-based deploys.
  publish:
    name: Publish Docker image to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: systematicmess/nexus_api:latest

  deploy:
    name: Publish and deploy to MonsterASP.NET (FTP)
    needs: [build, publish]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish for IIS
        shell: pwsh
        run: |
          dotnet publish API/API.csproj `
            --configuration Release `
            --output ./publish `
            --runtime win-x64 `
            --self-contained false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Create production settings from GitHub Actions secrets. Never commit
      # appsettings.Production.json or place credentials in this workflow.
      - name: Write production appsettings
        shell: pwsh
        env:
          CONSTR_SOMEE: ${{ secrets.PRODUCTION_CONSTR_SOMEE }}
          JWT_KEY: ${{ secrets.PRODUCTION_JWT_KEY }}
          GOOGLE_ID: ${{ secrets.PRODUCTION_GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.PRODUCTION_GOOGLE_SECRET }}
          MAIL_USERNAME: ${{ secrets.PRODUCTION_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.PRODUCTION_MAIL_PASSWORD }}
          NEWS_API_KEY: ${{ secrets.PRODUCTION_NEWS_API_KEY }}
        run: |
          # Every value is read through $env:NAME. Inlining ${{ secrets.* }}
          # into the script body injects the raw secret into PowerShell source,
          # where a quote, $ or backtick breaks the parser before it runs.
          if ([string]::IsNullOrWhiteSpace($env:CONSTR_SOMEE)) {
            throw "GitHub Actions secret PRODUCTION_CONSTR_SOMEE is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:JWT_KEY)) {
            throw "GitHub Actions secret PRODUCTION_JWT_KEY is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_ID)) {
            throw "GitHub Actions secret PRODUCTION_GOOGLE_ID is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_SECRET)) {
            throw "GitHub Actions secret PRODUCTION_GOOGLE_SECRET is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_USERNAME)) {
            throw "GitHub Actions secret PRODUCTION_MAIL_USERNAME is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_PASSWORD)) {
            throw "GitHub Actions secret PRODUCTION_MAIL_PASSWORD is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:NEWS_API_KEY)) {
            throw "GitHub Actions secret PRODUCTION_NEWS_API_KEY is not configured."
          }

          $settings = @{
            ConnectionStrings = @{
              constr = ""
              constr_somee = $env:CONSTR_SOMEE
              constr_docker = ""
            }
            Logging = @{
              LogLevel = @{
                Default = "Information"
                Microsoft = "Warning"
                "Microsoft.Hosting.Lifetime" = "Information"
              }
            }
            AllowedHosts = "*"
            JwtSettings = @{
              Issuer = "https://nexus-api.runasp.net"
              Audience = "https://mental-mediator-doctor-ui-graduation-project.vercel.app"
              Key = $env:JWT_KEY
              Duration = 30
            }
            GoogleAuthentication = @{
              Id = $env:GOOGLE_ID
              Secret = $env:GOOGLE_SECRET
            }
            MailSettings = @{
              Host = "smtp.gmail.com"
              Port = 587
              Username = $env:MAIL_USERNAME
              Password = $env:MAIL_PASSWORD
            }
            BaseAddress = "https://nexus-api.runasp.net"
            ClientUI = "https://mental-health-ochre.vercel.app"
            DoctorUI = "https://mental-mediator-doctor-ui-graduation-project.vercel.app"
            MLServerAddress = "https://sentiment-nja5.onrender.com/"
            NewsApi = @{
              Address = "https://newsapi.org/v2/"
              ApiKey = $env:NEWS_API_KEY
            }
          }

          $json = $settings | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "publish/appsettings.Production.json"),
            $json,
            (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item ./publish/appsettings.Development.json -ErrorAction SilentlyContinue
          Write-Host "Production appsettings generated."

      - name: Validate publish output
        shell: pwsh
        run: |
          if (-not (Test-Path ./publish/web.config)) {
            throw "web.config is missing from publish output; this is required for IIS hosting."
          }
          if (-not (Test-Path ./publish/API.dll)) {
            throw "API.dll is missing from publish output."
          }

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          log-level: standard

      - name: Verify deployment
        shell: pwsh
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
            $env:HEALTHCHECK_URL = "https://nexus-api.runasp.net/swagger/v1/swagger.json"
          }

          # Probe the site the way IIS would, so a 503 is explained instead of
          # just reported. A raw http.sys 503 means the application pool never
          # started and the app's own logs will be empty - see the README's
          # "Deploy Readiness Checklist" for what that implies.
          $site = "https://nexus-api.runasp.net"
          $staticProbe = "$site/robots.txt"

          try {
            $static = Invoke-WebRequest -Uri $staticProbe -UseBasicParsing -TimeoutSec 20
            Write-Host "Static probe $staticProbe -> HTTP $($static.StatusCode)"
          } catch {
            $staticStatus = $null
            if ($_.Exception.Response) {
              $staticStatus = [int]$_.Exception.Response.StatusCode
            }
            $serverHeader = "unknown"
            try {
              $resp = $_.Exception.Response
              if ($resp -and $resp.Headers) {
                $serverHeader = $resp.Headers["Server"]
              }
            } catch { }

            Write-Host "Static probe $staticProbe -> HTTP $staticStatus (Server: $serverHeader)"
            if ($staticStatus -eq 503) {
              Write-Host ""
              Write-Host "DIAGNOSIS: a request for a plain static file returned 503."
              Write-Host "IIS serves robots.txt without running the application, so the"
              Write-Host "application pool is not processing requests at all. A 'Server:"
              Write-Host "Microsoft-HTTPAPI/2.0' header means http.sys answered because the"
              Write-Host "worker process could not be started, so the application's own logs"
              Write-Host "will be empty even though the files uploaded correctly."
              Write-Host ""
              Write-Host "Check, in this order:"
              Write-Host "  1. Control Panel -> Files: is /wwwroot populated, or is the site archived?"
              Write-Host "  2. Control Panel -> Logs -> Event logs: Event ID 5011 (worker process"
              Write-Host "     cannot talk to http.sys) or 5059 (pool disabled by rapid-fail)."
              Write-Host "  3. Control Panel -> Logs -> ASP.NET Core debug: enable it and click"
              Write-Host "     'Restart application & reload log' to capture startup output."
              Write-Host "  4. Control Panel -> Process: restart the application pool."
              Write-Host ""
            }
          }

          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -UseBasicParsing -TimeoutSec 20
              if ($response.StatusCode -eq 200) {
                Write-Host "Deployment verified: health-check endpoint returned HTTP 200."
                exit 0
              }
              Write-Host "Health check returned HTTP $($response.StatusCode); retrying."
            } catch {
              Write-Host "Waiting for the application to restart: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }

          throw "Deployment verification failed. The application is not serving requests. See the diagnosis above and the README's Deploy Readiness Checklist."
