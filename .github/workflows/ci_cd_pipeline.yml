name: Nexus API CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nexus-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  deploy:
    name: Publish and deploy to MonsterASP.NET (FTP)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish for IIS
        shell: pwsh
        run: |
          dotnet publish API/API.csproj `
            --configuration Release `
            --output ./publish `
            --runtime win-x64 `
            --self-contained false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Create production settings from GitHub Actions secrets. Never commit
      # appsettings.Production.json or place credentials in this workflow.
      - name: Write production appsettings
        shell: pwsh
        env:
          CONSTR_SOMEE: ${{ secrets.PRODUCTION_CONSTR_SOMEE }}
          JWT_KEY: ${{ secrets.PRODUCTION_JWT_KEY }}
          GOOGLE_ID: ${{ secrets.PRODUCTION_GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.PRODUCTION_GOOGLE_SECRET }}
          MAIL_USERNAME: ${{ secrets.PRODUCTION_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.PRODUCTION_MAIL_PASSWORD }}
          NEWS_API_KEY: ${{ secrets.PRODUCTION_NEWS_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CONSTR_SOMEE)) {
            throw "GitHub Actions secret PRODUCTION_CONSTR_SOMEE is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:JWT_KEY)) {
            throw "GitHub Actions secret PRODUCTION_JWT_KEY is not configured."
          }

          $settings = @{
            ConnectionStrings = @{
              constr = ""
              constr_somee = $env:CONSTR_SOMEE
              constr_docker = ""
            }
            Logging = @{
              LogLevel = @{
                Default = "Information"
                Microsoft = "Warning"
                "Microsoft.Hosting.Lifetime" = "Information"
              }
            }
            AllowedHosts = "*"
            JwtSettings = @{
              Issuer = "https://nexus-api.runasp.net"
              Audience = "https://mental-mediator-doctor-ui-graduation-project.vercel.app"
              Key = $env:JWT_KEY
              Duration = 30
            }
            GoogleAuthentication = @{
              Id = $env:GOOGLE_ID
              Secret = $env:GOOGLE_SECRET
            }
            MailSettings = @{
              Host = "smtp.gmail.com"
              Port = 587
              Username = $env:MAIL_USERNAME
              Password = $env:MAIL_PASSWORD
            }
            BaseAddress = "https://nexus-api.runasp.net"
            ClientUI = "https://mental-health-ochre.vercel.app"
            DoctorUI = "https://mental-mediator-doctor-ui-graduation-project.vercel.app"
            MLServerAddress = "https://sentiment-nja5.onrender.com/"
            NewsApi = @{
              Address = "https://newsapi.org/v2/"
              ApiKey = $env:NEWS_API_KEY
            }
          }

          $settings | ConvertTo-Json -Depth 10 |
            Set-Content -Path ./publish/appsettings.Production.json -Encoding utf8

          Remove-Item ./publish/appsettings.Development.json -ErrorAction SilentlyContinue
          Write-Host "Production appsettings generated."

      - name: Validate publish output
        shell: pwsh
        run: |
          if (-not (Test-Path ./publish/web.config)) {
            throw "web.config is missing from publish output; this is required for IIS hosting."
          }
          if (-not (Test-Path ./publish/API.dll)) {
            throw "API.dll is missing from publish output."
          }

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          log-level: standard

      - name: Verify deployment
        shell: pwsh
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
            $env:HEALTHCHECK_URL = "https://nexus-api.runasp.net/swagger/v1/swagger.json"
          }

          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -UseBasicParsing -TimeoutSec 20
              if ($response.StatusCode -eq 200) {
                Write-Host "Deployment verified: health-check endpoint returned HTTP 200."
                exit 0
              }
              Write-Host "Health check returned HTTP $($response.StatusCode); retrying."
            } catch {
              Write-Host "Waiting for the application to restart: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }

          throw "Deployment verification failed. Check the app's IIS/.NET hosting configuration and PRODUCTION_HEALTHCHECK_URL."
